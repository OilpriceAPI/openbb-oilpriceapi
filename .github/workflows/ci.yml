name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -v --cov=openbb_oilpriceapi --cov-report=xml

      - name: Run static checks
        run: |
          poetry run ruff check openbb_oilpriceapi tests examples
          poetry run ruff format --check openbb_oilpriceapi tests examples

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2

      - name: Build wheel
        run: poetry build

      - name: Verify isolated provider entry point
        run: |
          python -m venv /tmp/openbb-provider-smoke
          /tmp/openbb-provider-smoke/bin/pip install dist/*.whl
          EXPECTED_VERSION="$(poetry version -s)" /tmp/openbb-provider-smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points, version
          import os
          from openbb_oilpriceapi import oilpriceapi_provider

          assert version("openbb-oilpriceapi") == os.environ["EXPECTED_VERSION"]
          assert oilpriceapi_provider.name == "oilpriceapi"
          assert set(oilpriceapi_provider.fetcher_dict) == {"OilPrice", "OilHistorical"}
          matches = [
              entry_point
              for entry_point in entry_points(group="openbb_provider_extension")
              if entry_point.name == "oilpriceapi"
          ]
          assert len(matches) == 1
          assert matches[0].load().name == "oilpriceapi"
          PY

  publish:
    needs: [test, package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish
